# MantenIA MVP v1.0 — pipeline ML controlado: entrenamiento reproducible, compuerta, registro y promoción.
# Separado de CI: solo se ejecuta manualmente o si cambia el código ML. Nunca en main (D14).
# No reemplaza edge_service/models: la promoción genera un paquete de despliegue aislado.
name: Pipeline ML

on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Promover el candidato si la compuerta lo aprueba"
        type: boolean
        default: false
  push:
    branches: [mvp-v1.0]
    paths: ["scripts/mlops/**", "scripts/ml_repro/**", "edge_service/models/selection_locked.json"]

permissions:
  contents: read

concurrency:
  group: ml-pipeline
  cancel-in-progress: false

env:
  WORKDIR: mlops-work
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  entrenar-y-evaluar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.candidato.outputs.version }}
      status: ${{ steps.compuerta.outputs.status }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock-docker.txt
      - run: pip install -r requirements-lock-docker.txt
      - name: Caché del dataset AI4I 2020 (se verifica su SHA-256 en cada ejecución)
        uses: actions/cache@v4
        with:
          path: mlops-work/data/raw
          key: ai4i2020-dc6630cd9b1f
      - name: Pipeline reproducible (split original, RF congelado, validación OOF en TRAIN)
        id: candidato
        run: |
          python -m scripts.mlops.pipeline --workdir "$WORKDIR" | tee pipeline.json
          echo "version=$(python -c "import json;print(json.load(open('pipeline.json'))['version'])")" >> "$GITHUB_OUTPUT"
      - name: Compuerta de aceptación
        id: compuerta
        run: |
          set +e
          python -m scripts.mlops.gate --model-dir "$WORKDIR/candidates/${{ steps.candidato.outputs.version }}" --output "$WORKDIR/gate.json"
          code=$?
          echo "status=$([ $code -eq 0 ] && echo accepted || echo rejected)" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Registrar resultado (copia del registro; el versionado no se modifica en CI)
        run: |
          cp registry/model_registry.json "$WORKDIR/registro.json"
          python -m scripts.mlops.registry register --registry "$WORKDIR/registro.json" \
            --model-dir "$WORKDIR/candidates/${{ steps.candidato.outputs.version }}" --note "CI ${{ github.run_id }}" || true
          cp pipeline.json "$WORKDIR/"
      - name: Verificar que un modelo rechazado no puede promoverse (copia manipulada, registro temporal)
        run: |
          python - <<'PY'
          import json, shutil, sys
          from pathlib import Path
          from scripts.mlops import registry
          src = Path("mlops-work/candidates/${{ steps.candidato.outputs.version }}")
          bad = Path("/tmp/rechazado"); shutil.copytree(src, bad)
          meta = json.loads((bad / "model_metadata.json").read_text(encoding="utf-8"))
          meta["validation_metrics"]["Recall"] = 0.55
          (bad / "model_metadata.json").write_text(json.dumps(meta), encoding="utf-8")
          entry = registry.register(bad, "/tmp/registro_rechazo.json")
          assert entry["status"] == "rejected", entry
          try:
              registry.promote(entry["version"], "/tmp/despliegue_rechazado", "/tmp/registro_rechazo.json")
          except registry.PromotionError as exc:
              print("Promoción bloqueada como se esperaba:", exc)
              sys.exit(0)
          sys.exit("ERROR: se promovió un modelo rechazado")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidato-ml
          path: |
            mlops-work/candidates/
            mlops-work/gate.json
            mlops-work/registro.json
            mlops-work/pipeline.json
          retention-days: 7
      - name: Bloquear si la compuerta rechaza
        if: steps.compuerta.outputs.status != 'accepted'
        run: |
          echo "::error::La compuerta rechazó el candidato ${{ steps.candidato.outputs.version }}"
          exit 1

  promover:
    needs: entrenar-y-evaluar
    if: needs.entrenar-y-evaluar.outputs.status == 'accepted' && github.event_name == 'workflow_dispatch' && inputs.promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-lock-docker.txt
      - run: pip install -r requirements-lock-docker.txt
      - uses: actions/download-artifact@v4
        with:
          name: candidato-ml
          path: mlops-work
      - name: Promover (solo modelos aprobados) a un paquete de despliegue aislado
        run: |
          python -m scripts.mlops.registry promote --registry "$WORKDIR/registro.json" \
            --version "${{ needs.entrenar-y-evaluar.outputs.version }}" --deploy-dir "$WORKDIR/despliegue"
          python -c "from pathlib import Path; from edge_service.app.model_loader import ModelBundle; print(ModelBundle(Path('$WORKDIR/despliegue')).version)"
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-despliegue-${{ needs.entrenar-y-evaluar.outputs.version }}
          path: |
            mlops-work/despliegue/
            mlops-work/registro.json
          retention-days: 7
      - name: Despliegue remoto (se habilita en el Bloque C)
        if: vars.MANTENIA_DEPLOY_ENABLED == 'true'
        run: echo "Pendiente del Bloque C — staging gratuito; requiere aprobación del responsable."
