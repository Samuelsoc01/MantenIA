# D16 (aprobada 2026-11-25): proyecto, imágenes y volumen propios del MVP v1.0.
# La v0.2 (rama main) conserva el proyecto mantenia-v02, el puerto 8000 y su volumen histórico.
name: mantenia-v10
services:
  edge:
    image: mantenia-v10-edge:dev
    build:
      context: .
      target: edge
    environment:
      MAX_CSV_ROWS: ${MAX_CSV_ROWS:-1000}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2097152}
      # Bloque C: modelo desplegado por scripts/mlops/deploy.py (sin active.json se usa el congelado de la imagen).
      DEPLOY_DIR: /app/deploy
    volumes: ["${MANTENIA_DEPLOY_DIR:-./.runtime/deploy}:/app/deploy:ro"]
    networks: [local_only]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
  backend:
    image: mantenia-v10-backend:dev
    build:
      context: .
      target: backend
    # Solo loopback. Puerto del host configurable; el Edge no publica puertos.
    ports: ["127.0.0.1:${MANTENIA_BACKEND_PORT:-8100}:8000"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      EDGE_SERVICE_URL: http://edge:8001
      DATABASE_URL: sqlite:////app/database/mantenia.db
      STORE_RAW_INPUTS: ${STORE_RAW_INPUTS:-false}
      ESTIMATED_COST_PER_INFERENCE_MXN: ${ESTIMATED_COST_PER_INFERENCE_MXN:-0.7333}
      BILLING_FIXED_FEE_MXN: ${BILLING_FIXED_FEE_MXN:-3500.00}
      BILLING_RATE_PER_UNIT_MXN: ${BILLING_RATE_PER_UNIT_MXN:-1.00}
      PROJECT_NAME: ${PROJECT_NAME:-MantenIA}
      COMPONENT_NAME: ${COMPONENT_NAME:-backend}
      RESOURCE_NAME: ${RESOURCE_NAME:-cpu}
      DEFAULT_CLIENT_ID: ${DEFAULT_CLIENT_ID:-cliente_demo_01}
      MAX_CSV_ROWS: ${MAX_CSV_ROWS:-1000}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-2097152}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # Fase 1: sesiones. En staging/producción SESSION_COOKIE_SECURE=true es obligatorio (el backend no arranca sin él).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_WINDOW_MINUTES: ${LOGIN_WINDOW_MINUTES:-15}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      API_KEY_DEFAULT_DAYS: ${API_KEY_DEFAULT_DAYS:-90}
      API_KEY_MAX_DAYS: ${API_KEY_MAX_DAYS:-365}
      # Bloque B: alertas, deriva y FinOps simulado (valores por omisión documentados en .env.example).
      ALERT_MIN_REQUESTS: ${ALERT_MIN_REQUESTS:-20}
      ALERT_ERROR_RATE: ${ALERT_ERROR_RATE:-0.05}
      ALERT_P95_MS: ${ALERT_P95_MS:-2000}
      ALERT_WINDOW_HOURS: ${ALERT_WINDOW_HOURS:-24}
      DRIFT_WINDOW_DAYS: ${DRIFT_WINDOW_DAYS:-7}
      DRIFT_MIN_SAMPLE: ${DRIFT_MIN_SAMPLE:-200}
      BUDGET_MONTHLY_MXN: ${BUDGET_MONTHLY_MXN:-2200}
      BUDGET_ALERT_RATIO: ${BUDGET_ALERT_RATIO:-0.80}
      FINOPS_RATE_VCPU_HOUR_MXN: ${FINOPS_RATE_VCPU_HOUR_MXN:-0.9041}
      FINOPS_RATE_GB_RAM_HOUR_MXN: ${FINOPS_RATE_GB_RAM_HOUR_MXN:-0.2260}
      FINOPS_RATE_GB_STORAGE_MONTH_MXN: ${FINOPS_RATE_GB_STORAGE_MONTH_MXN:-4.40}
      FINOPS_RATES_DATE: ${FINOPS_RATES_DATE:-2026-11-25}
      FINOPS_SAMPLE_SECONDS: ${FINOPS_SAMPLE_SECONDS:-60}
    volumes: [mantenia_db:/app/database]
    networks: [local_only, ingress]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    depends_on:
      edge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 20s
  tunnel:
    # Bloque C: túnel HTTPS gratuito (Cloudflare Quick Tunnel, sin cuenta ni tarjeta). Imagen local fijada por
    # digest. Solo está en la red ingress: alcanza al backend, nunca al Edge, a SQLite ni al daemon de Docker.
    profiles: [tunnel]
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    command: ["tunnel", "--no-autoupdate", "--url", "http://backend:8000"]
    networks: [ingress]
    read_only: true
    security_opt: [no-new-privileges:true]
    depends_on:
      backend:
        condition: service_healthy
  tests:
    profiles: [test]
    image: mantenia-v10-tests:dev
    build:
      context: .
      target: tests
    network_mode: none
volumes:
  mantenia_db:
    # Nombre explícito: ni siquiera con -p mantenia-v02 se usaría el volumen histórico.
    name: ${MANTENIA_V10_VOLUME:-mantenia-v10_mantenia_db}
networks:
  local_only:
    internal: true
  ingress:
    driver: bridge
